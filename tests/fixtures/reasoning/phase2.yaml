client_id: fieldtest
display_name: Phase 2 evidence fixture
reasoning:
  enabled: true
  timezone: Asia/Kolkata
  target:
    id: ordered_units
    definition: Units ordered each month
    outcome_source: order_lines
    unit_field: uom
  sources:
    - id: facilities
      kind: csv
      dataset: relationship
      relation_type: produced_at
      subject_type: item
      object_type: location
      location_role: site
      required_for_forecast: false
      path: sites.csv
      fields: {record_id: id, subject_id: item, object_id: site, effective_from: start}
  evidence:
    erp:
      - id: formula
        kind: csv
        dataset: bom
        path: bom.csv
        fields: {record_id: id, item_id: item, material_id: material, site_id: site, unit: uom, finished_unit: output_uom, quantity: qty, effective_from: at}
      - id: on_hand
        kind: csv
        dataset: usable_stock
        path: stock.csv
        fields: {record_id: id, material_id: material, site_id: site, unit: uom, quantity: qty, effective_from: at}
      - id: schedule
        kind: csv
        dataset: consumption
        path: consumption.csv
        fields: {record_id: id, material_id: material, site_id: site, unit: uom, quantity: qty, effective_from: at}
      - id: incoming
        kind: csv
        dataset: receipt
        path: receipts.csv
        fields: {record_id: id, material_id: material, site_id: site, unit: uom, quantity: qty, effective_from: at, known_at: release, version: revision, status: status}
    news:
      api_key_env: PHASE2_TEST_BRAVE
      max_pages: 2
      page_size: 3
      searches:
        - {id: material_public, public_alias: "industrial flax", entity_type: material, entity_id: M}
        - {id: market, public_alias: "coastal trade", primary_domains: [port.example]}
    weather:
      access: noncommercial
      applicable_roles: [site]
      locations:
        - {location_id: A, role: site, latitude: 19.0, longitude: 72.8}
        - {location_id: B, role: site, latitude: 19.0, longitude: 72.8}
        - {location_id: TERRITORY, role: customer, latitude: 28.6, longitude: 77.2}
    enso: {}
