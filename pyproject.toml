[project]
name = "prediction-engine"
version = "0.1.0"
description = "ERP-native demand forecasting and decision engine"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.20",
    "fastexcel>=0.12",
    "duckdb>=1.1,<2",  # EngineStore uses DuckDB's 1.x .pl() result API.
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "numpy>=1.26",
    "lightgbm>=4.5",
    "statsforecast>=2.0",
    "statsmodels>=0.14",
    "tzdata>=2025.1; sys_platform == 'win32'",
    "holidays>=0.50",  # festival dates for the reasoning layer (offline)
]

[project.optional-dependencies]
# Pulls in PyTorch (~3 GB). Kept separable so a deployment that only wants the
# classical portfolio can skip it — drop chronos2 from models.enabled to match.
foundation = [
    "chronos-forecasting>=2.0",
]
# PostgreSQL source. Arrow-native bulk read and ingest via ADBC; kept
# separable so a file-fed deployment does not pull pyarrow.
postgres = [
    "adbc-driver-postgresql>=1.3",
    "pyarrow>=18",
]
# Model providers for the reasoning layer. Install the one a client uses, e.g.
# `pip install -e ".[openai]"`. Each is imported only when that provider is configured.
openai = ["openai>=2.0"]
anthropic = ["anthropic>=0.80"]
gemini = ["google-genai>=1.30"]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    # The adapter tests build real SDK requests against fake transports.
    "openai>=2.0",
    "anthropic>=0.80",
    "google-genai>=1.30",
]

[project.scripts]
engine = "engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# CSS and HTML templates read better unwrapped.
"src/engine/reason/report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Tests that load pretrained model weights are excluded by default; run them
# with `pytest -m slow`.
addopts = "-m 'not slow and not integration'"
markers = [
    "slow: loads pretrained model weights (needs the model cached)",
    "integration: needs a live PostgreSQL (set ENGINE_PG_DSN)",
]
