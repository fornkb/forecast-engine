[project]
name = "prediction-engine"
version = "0.1.0"
description = "ERP-native demand forecasting and decision engine"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.20",
    "fastexcel>=0.12",
    "duckdb>=1.1",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "numpy>=1.26",
    "lightgbm>=4.5",
    "statsforecast>=2.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
engine = "engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
