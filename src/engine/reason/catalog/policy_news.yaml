id: policy_news
kind: policy
description: News search on a regulation, tax, duty or government programme in the company's country.
connectors: [news]
news_query: '{topic} {country_name}'
required_params: [topic]
mechanism_hint: >-
  Rule, tax and duty changes alter prices, imports or what customers may buy. Look for
  an effective date and whether the change is confirmed or only proposed.
