id: seasonal_weather
kind: weather
description: Monthly temperature and rainfall outlook for a region versus its 10-year normal (Open-Meteo, ECMWF SEAS5).
connectors: [weather]
required_params: [region]
mechanism_hint: >-
  Hotter or drier than normal months can raise demand for cooling, drinks and water,
  and slow outdoor work; wetter months can do the opposite. Regional model output,
  not bias-corrected.
