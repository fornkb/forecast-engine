id: enso
kind: climate
description: Current El Niño / La Niña (ENSO) status from NOAA CPC, plus news about its expected effects in the country.
connectors: [enso, news]
news_query: '("El Nino" OR "La Nina") {country_name}'
mechanism_hint: >-
  ENSO is a global climate pattern that shifts seasonal rainfall and temperature, with
  effects that differ by region. A NOAA status alone is not a local forecast; local
  effects need regional evidence.
