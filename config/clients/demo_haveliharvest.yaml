client_id: demo_haveliharvest
display_name: "Haveli Harvest Oils (sample: edible oils, North India)"
currency: INR

# Fictional sample company for the mock run. Generated by scripts/make_demo_oil.py
# (real festival dates, real Delhi temperatures, real import-duty changes; see
# docs/mock-run/README.md).
source:
  reader: csv_panel
  sheet: null
  column_map:
    series_id: series_id
    customer: customer
    item_code: item_code
    description: description
    item_group: item_group
    period: period
    quantity: quantity
    uom: uom
    source_sheet: source_sheet
    ground_truth_pattern: null

calendar:
  granularity: monthly
  fiscal_year_start_month: 4

hierarchy:
  series_key: [customer, item_code]
  grouping_keys:
    - item_group

evaluation:
  horizon: 6 # six months: wedding season, Holi and the mustard harvest
  origins: 3
  origin_step: 1
  min_train_periods: 24

patterns:
  zero_fraction_intermittent: 0.30
  adi_intermittent: 1.32
  seasonal_strength: 0.88
  trend_strength: 0.60
  volatility_cv: 0.15

segments:
  head_share: 0.80
  mid_share: 0.95

models:
  enabled:
    - seasonal_naive
    - naive
    - auto_ets
    - lightgbm_global
  baseline: seasonal_naive
  arbitration:
    selection_metric: mae
    min_improvement_pct: 15.0
    stratify_by: volume_segment
    champion_metric: median_series_wape
  static_features:
    - customer
    - item_group
  lightgbm:
    objective: l1
    learning_rate: 0.05
    num_leaves: 15
    min_data_in_leaf: 10
    num_boost_round: 300

exogenous:
  features: []
  level_features: []
probabilistic:
  enabled: true
  levels: [0.1, 0.5, 0.9]
cost_model: null

# The reasoning layer. There is deliberately NO company profile yet: in the mock run the
# AI drafts config/profiles/demo_haveliharvest.yaml from the ERP data and the manager's answers.
# A reference profile to compare against is in docs/mock-run/reference_profile.yaml.
reasoning:
  enabled: true
  timezone: Asia/Kolkata
  llm:
    provider: openai # openai | anthropic | gemini
    model: gpt-6.2-sol # reasoning call; check the name on your provider account
    triage_model: gpt-6-luna # cheap model, only used when many articles need screening
    effort: low # minimal | low | medium | high | xhigh | max (mapped per provider)
    max_output_tokens: 8000
    rates: # USD per million tokens, only used to report cost
      gpt-6.2-sol: {input_per_m: 2.0, output_per_m: 10.0}
      gpt-6-luna: {input_per_m: 0.1, output_per_m: 0.5}
    recordings_dir: data/demo/recordings/demo_haveliharvest
  budget:
    max_calls_per_run: 3
    max_input_tokens: 20000
    max_judgment_pct: 10
  sources:
    news: {provider: gdelt, lookback_days: 30, max_articles_per_driver: 6, source_country: india}
    weather: {access: noncommercial}
    enso: true
