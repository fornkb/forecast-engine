client_id: teknic_mumbai_pg
display_name: "Teknic — Mumbai Operations (PostgreSQL source)"
currency: INR

# Same client, same data, read from the ERP database instead of the workbook.
# Kept alongside teknic_mumbai so the two stores can be compared row for row —
# a database source that changes the numbers is a bug, not a feature.
source:
  reader: postgres_panel
  database:
    dsn_env: ENGINE_PG_DSN
    relation: erp.v_demand_history
  column_map: # names as the view exposes them, not as the workbook spelled them
    series_id: series_id
    customer: customer
    item_code: item_code
    description: description
    item_group: item_group
    period: period
    quantity: quantity
    uom: uom
    source_sheet: source_sheet
    ground_truth_pattern: demand_pattern # validation only, never a model feature

# Where published forecasts go. A different role and a different DSN from the
# source above: the reader sees the ERP's sales history, the writer sees the
# forecast output, and neither can do the other's job.
output:
  postgres:
    dsn_env: ENGINE_PG_WRITE_DSN
    target_schema: forecast_output

calendar:
  granularity: monthly
  fiscal_year_start_month: 4

hierarchy:
  series_key: [customer, item_code]
  grouping_keys: # independent axes, not levels of one tree
    - item_group
    - source_sheet

evaluation:
  horizon: 3
  origins: 3
  origin_step: 1
  min_train_periods: 24

patterns:
  zero_fraction_intermittent: 0.30
  adi_intermittent: 1.32
  seasonal_strength: 0.88
  trend_strength: 0.60
  volatility_cv: 0.15

segments: # cumulative volume-share boundaries for Head / Mid / Tail
  head_share: 0.80
  mid_share: 0.95

models:
  enabled:
    - seasonal_naive
    - naive
    - auto_ets
    - croston
    - lightgbm_global
    - chronos2
  baseline: seasonal_naive # Forecast Value Add reference
  arbitration:
    selection_metric: mae
    min_improvement_pct: 15.0
    stratify_by: volume_segment # default model is chosen per segment, not globally
    champion_metric: median_series_wape # the typical series in the segment, not its biggest
  static_features: # categorical attributes the pooled model may learn from
    - customer
    - item_group
    - source_sheet
  lightgbm:
    objective: l1
    learning_rate: 0.05
    num_leaves: 31
    min_data_in_leaf: 20
    num_boost_round: 400
  chronos: # zero-shot foundation model — pretrained, never fitted here
    model_id: amazon/chronos-2
    device: cpu
    batch_size: 64

# No context features for this client — the synthetic panel has no exogenous
# drivers to supply.
exogenous:
  features: []
  level_features: []
# Quantiles every model is asked to produce. Safety stock and any service-level
# target need a distribution, not a point.
probabilistic:
  enabled: true
  levels: [0.1, 0.5, 0.9]
cost_model:
  # A stockout is assumed to hurt nine times as much as carrying a unit for a
  # month. That ratio is what sets the policy: 9/(9+1) means stock to the 90th
  # percentile, which is why 0.9 has to be in probabilistic.levels above.
  # The units are abstract — this client's source carries no prices, so nothing
  # here is currency and the engine does not pretend otherwise.
  holding_cost_per_unit: 1.0
  shortage_cost_per_unit: 9.0
  lead_time_periods: 1
  review_period_periods: 1
