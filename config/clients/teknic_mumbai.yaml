client_id: teknic_mumbai
display_name: "Teknic — Mumbai Operations"
currency: INR

source:
  reader: excel_demand
  sheet: null # null = first sheet in the workbook
  column_map:
    series_id: "Series ID"
    customer: "Customer"
    item_code: "Item Code"
    description: "Description"
    item_group: "Item Group"
    period: "Demand Month"
    quantity: "Demand Quantity"
    uom: "UOM"
    source_sheet: "Source Sheet"
    ground_truth_pattern: "Demand Pattern" # validation only, never a model feature

calendar:
  granularity: monthly
  fiscal_year_start_month: 4

hierarchy:
  series_key: [customer, item_code]
  grouping_keys: # independent axes, not levels of one tree
    - item_group
    - source_sheet

evaluation:
  horizon: 3
  origins: 3
  origin_step: 1
  min_train_periods: 24

patterns:
  zero_fraction_intermittent: 0.30
  adi_intermittent: 1.32
  seasonal_strength: 0.88
  trend_strength: 0.60
  volatility_cv: 0.15

segments: # cumulative volume-share boundaries for Head / Mid / Tail
  head_share: 0.80
  mid_share: 0.95

models:
  enabled:
    - seasonal_naive
    - naive
    - auto_ets
    - croston
    - lightgbm_global
    - chronos2
  baseline: seasonal_naive # Forecast Value Add reference
  arbitration:
    selection_metric: mae
    min_improvement_pct: 15.0
    stratify_by: volume_segment # default model is chosen per segment, not globally
    champion_metric: median_series_wape # the typical series in the segment, not its biggest
  static_features: # categorical attributes the pooled model may learn from
    - customer
    - item_group
    - source_sheet
  lightgbm:
    objective: l1
    learning_rate: 0.05
    num_leaves: 31
    min_data_in_leaf: 20
    num_boost_round: 400
  chronos: # zero-shot foundation model — pretrained, never fitted here
    model_id: amazon/chronos-2
    device: cpu
    batch_size: 64

# No context features for this client — the synthetic panel has no exogenous
# drivers to supply.
exogenous:
  features: []
  level_features: []
# Quantiles every model is asked to produce. Safety stock and any service-level
# target need a distribution, not a point.
probabilistic:
  enabled: true
  levels: [0.1, 0.5, 0.9]
cost_model:
  # A stockout is assumed to hurt nine times as much as carrying a unit for a
  # month. That ratio is what sets the policy: 9/(9+1) means stock to the 90th
  # percentile, which is why 0.9 has to be in probabilistic.levels above.
  # The units are abstract — this client's source carries no prices, so nothing
  # here is currency and the engine does not pretend otherwise.
  holding_cost_per_unit: 1.0
  shortage_cost_per_unit: 9.0
  lead_time_periods: 1
  review_period_periods: 1

# The reasoning layer (external factors and a ± band). The company profile is in
# config/profiles/teknic_mumbai.yaml; demo scenario: data/demo/scenarios/teknic_copper.json.
reasoning:
  enabled: true
  timezone: Asia/Kolkata
  llm:
    provider: openai # openai | anthropic | gemini
    model: gpt-6.2-sol
    triage_model: gpt-6-luna
    effort: low
    rates:
      gpt-6.2-sol: {input_per_m: 2.0, output_per_m: 10.0}
      gpt-6-luna: {input_per_m: 0.1, output_per_m: 0.5}
    recordings_dir: data/demo/recordings/teknic_mumbai
  sources:
    news: {provider: gdelt, lookback_days: 30, max_articles_per_driver: 6, source_country: india}
